[project]
name = "flakefighters-experiment"
description = "Evaluation replication package for flakefighters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "gitpython>=3.1.46",
    "numpy>=2.2.6",
    "pygithub>=2.8.1",
    "pytest>=9.0.2",
    "pytest-flakefighters>=0.4.1",
    "requests>=2.32.5",
    "docker==7.1.0",
    "jinja2>=3.1.6",
]
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.black]
# https://github.com/psf/black
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
